<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>POS System - FIFO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; 
            background: #f5f5f5; 
            height: 100vh; 
            overflow: hidden;
        }
        .app-header {
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .app-header .info {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .app-iframe {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            display: block;
            background: white;
        }
        @media (max-width: 768px) {
            .app-header h1 { font-size: 1rem; }
            .app-header .info { font-size: 0.7rem; }
        }
        @media (max-width: 480px) {
            .app-header { padding: 8px 12px; flex-wrap: wrap; gap: 5px; }
            .app-header h1 { font-size: 0.9rem; }
            .app-iframe { height: calc(100vh - 50px); }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>🛒 POS System (FIFO)</h1>
        <span class="info">📱 Aplikasi Kasir</span>
    </div>
    <iframe class="app-iframe" src="https://script.google.com/macros/s/AKfycbwp7En0r8tcgvaYQLgwNYub2q3xp63YByUfz8EwmfZ7fYYuIAFZRqsP1HdiuclG54GrUg/exec"></iframe>
</body>
</html>
